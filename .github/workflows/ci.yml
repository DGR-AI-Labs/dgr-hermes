name: Repository CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public repository contents and documentation
        run: python3 scripts/check_repository.py
      - name: Compile repository checker
        run: python3 -m py_compile scripts/check_repository.py
      - name: Install package and contributor example
        run: |
          python3 -m pip install . ./examples/word_report
      - name: Test module lifecycle and sample behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check out the tested Hermes API
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: .hermes-test-source
          persist-credentials: false
      - name: Install minimal host-test dependencies
        run: python3 -m pip install -r tests/requirements-hermes.txt
      - name: Verify real Hermes load, dispatch and unload
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-test-source
        run: python3 scripts/check_hermes_integration.py
