name: Repository CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public repository contents and documentation
        run: python3 scripts/check_repository.py
      - name: Compile repository checker
        run: python3 -m py_compile scripts/check_repository.py
